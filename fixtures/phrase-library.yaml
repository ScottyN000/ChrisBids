# Contractor Co. phrase library, transcribed from the Proposal Format Example
# (source/contractor_proposal-format-example.pdf, sha256 c0e99ac8...4484).
# The PDF text layer is garbled, so every phrase below was read from the
# rendered page image. Only the narrative pages (p.1-7) and the terms pages
# (p.15 bottom - p.17) were used; the priced export (p.8-15) was not.
# Quantities in the example belong to another job and are NOT carried here:
# allowance slots are filled from a job's ledger only.
# Wording is verbatim, including the example's own typos.

source: PFE
phrases:
  greeting:
    loc: p.1
    text: "Hello {client}, thank you for considering Contractor Co. The purpose of this document is to define the deliverables, description of materials, quality, grade, and schedule of work."
  contractor_block:
    loc: p.1
    text: "Contractor Co.\nAddress: 100 Example Ave. Ocean City MD 21842\nPh: 1-555-555-0100\nEmail: info@example.com"
  license_line:
    loc: p.1
    text: "FL CGC. License# CGC0000000 MHIC#000000 DE#0000000000 • Mailing Address: 100 Example Ct, Merritt Island FL 32953"

  # Division 01, p.1-2. The example is one paragraph; it is split into
  # sentences here so a job selects only the sentences that apply.
  gc_site:
    loc: p.1
    text: "Prepare the site for the project. Set up work trailer and/or equipment needed to complete the project. The work site will be maintained and cleaned daily. All debris and waste will be removed from the site. All OSHA safety guidelines will be adhered to at all times."
  gc_harness:
    loc: p.1
    text: "Safety harnesses will be worn by workers while using the lift for fall protection."
  gc_ppe:
    loc: p.1
    text: "Safety glasses, hard hats and masks will be worn. Work areas will have signs posted and will be caution taped off."
  gc_protect:
    loc: p.1
    text: "Precautions will be taken to protect shrubs, plants, fences and personal property."
  gc_hardware:
    loc: p.1
    text: "Remove and protect hardware, accessories, device plates, lighting fixtures, factory finished work and similar items or provide ample in-place protection. Upon completion of each space, carefully replace all removed items. Cover all electrical panel box covers and doors before painting walls."
  gc_vehicles:
    loc: p.1
    text: "While painting in areas near parking lots, we request that all vehicles be removed from the area to prevent and overspray from damaging the vehicle. In the event that vehicles are left in the area, we will attempt to protect them with plastic but, Contractor Co. will not be held liable for vehicles left in range of potential overspray."
  gc_access:
    loc: p.1
    text: "Shear walls and balconies will be accessed by swing stage, man lift scaffolding or other means. The man lift will be stored daily in the upright position for safety purposes in a location on site approved by the association."
  gc_landscape:
    loc: p.1-2
    text: "*Contractor Co. will take precautions to protect the landscape. We will use tread mats and plywood under the tires while moving the lift in the grassy areas. However, there is still a chance that some damage can occur. Contractor Co. can facilitate a professional landscaping crew to conduct repairs after the job is completed at an additional cost if requested by the association."
  gc_clear:
    loc: p.2
    text: "Contractor Co. will ensure that the site is cleared of all equipment, tools, work trailers, rental equipment and materials."

  # Division 02, 2.1 Powerwashing, p.2
  wash_1:
    loc: p.2
    text: "Power wash all designated exterior surfaces using commercial-grade equipment to remove dirt, mildew, chalking, oxidation, loose coatings, and environmental contaminants."
  wash_2:
    loc: p.2
    text: "Rinse all surfaces completely and allow them to dry prior to subsequent repair or coating activities."
  wash_3:
    loc: p.2
    text: "Inspect cleaned surfaces for underlying deterioration, delamination, or substrate failure."
  wash_4:
    loc: p.2
    text: "Any concealed damage discovered during or after powerwashing will be documented and brought to the Owner's attention, with corrective work addressed through a change order if required."
  wash_5:
    loc: p.2
    text: "Confirm all elevations are fully cleaned and properly prepared to receive base coats, finish coats, or exterior paint systems."

  # Concrete repair bullets, p.2-4
  conc_excavate:
    loc: p.3
    text: "Excavate deteriorated or spalled concrete on column surfaces to sound material, removing all loose, delaminated, or fractured sections."
  conc_spall_excavate:
    loc: p.3
    text: "Excavate spalled concrete areas to sound substrate, removing all loose, delaminated, or fractured material."
  conc_rebar:
    loc: p.3
    text: "Expose reinforcing steel where present and clean to bright metal using mechanical methods."
  conc_bond:
    loc: p.3
    text: "Treat exposed rebar with a corrosion-inhibiting bonding agent to ensure proper adhesion and long-term durability."
  conc_square:
    loc: p.3
    text: "Square repair edges to establish defined boundaries and eliminate feathering."
  conc_rebuild_column:
    loc: p.3
    text: "Rebuild column surfaces using approved repair mortar, restoring original dimensions, geometry, and load-bearing continuity."
  conc_rebuild_spall:
    loc: p.3
    text: "Rebuild spall areas using approved repair mortar, restoring original dimensions, structural continuity, and surface profile."
  conc_smooth:
    loc: p.3
    text: "Apply smoothing compound as needed to blend repaired sections with adjacent concrete surfaces and achieve a uniform finish suitable for subsequent coating."
  pocket_remove:
    loc: p.4
    text: "Remove railing posts, anchors, fasteners, and associated hardware from existing concrete post pockets."
  pocket_chip:
    loc: p.4
    text: "Chip out loose, deteriorated, or delaminated concrete to expose sound substrate."
  pocket_clean:
    loc: p.4
    text: "Clean pockets of dust, debris, and corrosion to ensure proper bonding of repair materials."
  pocket_prep:
    loc: p.4
    text: "Prepare exposed concrete surfaces per manufacturer requirements for patching materials."
  pocket_mortar:
    loc: p.4
    text: "Install approved repair mortar (Sika, Euclid, or engineer-specified equivalent) to rebuild post pockets to proper depth, shape, and structural integrity."

  # Division 07, 7.1 Joint Sealants, p.5
  seal_remove:
    loc: p.5
    text: "Remove existing failed, deteriorated, or loose sealant at all designated window sill locations."
  seal_clean:
    loc: p.5
    text: "Clean and prepare joint surfaces by removing debris, contaminants, and residual sealant to ensure proper adhesion."
  seal_tool:
    loc: p.5
    text: "Tool sealant to proper profile to ensure watertight performance, uniform appearance, and long-term flexibility."

  # Division 09, 9.3 Exterior Coatings, p.6-7
  coat_prep:
    loc: p.7
    text: "Prepare substrates by scraping loose or peeling coatings, spot-priming bare or repaired areas, and ensuring all surfaces are clean, dry, and suitable for new coating application."
  coat_apply:
    loc: p.7
    text: "Install coatings in accordance with manufacturer spread rates and drying requirements to ensure uniform coverage, consistent sheen, and long-term weather resistance."
  coat_finish:
    loc: p.7
    text: "Finish all elevations with clean transitions at architectural breaks, edges, and adjacent surfaces to achieve a cohesive and uniform appearance across the entire building envelope."

  # Allowance parentheticals, p.2-5. {qty} {unit} {what} are ledger slots.
  allowance:
    loc: p.2
    text: "Contractor Co. allowance of {qty} {unit} for {what}."
  concealed_excavation:
    loc: p.2
    text: "Any concealed deterioration or structural deficiencies discovered during excavation will be documented and brought to the Owner's attention, with corrective work handled as a change order if required."
  concealed_reinforcement:
    loc: p.3
    text: "Any concealed deterioration, structural deficiencies, or reinforcement loss discovered during excavation will be documented and brought to the Owner's attention, with corrective work addressed through a change order if required."
  concealed_preparation:
    loc: p.5
    text: "Any concealed deterioration discovered during preparation will be documented and brought to the Owner's attention, with corrective work addressed through a change order if required."

  # Exclusions, p.15-16 (bold lead + rest of line, verbatim)
  excl_engineered:
    loc: p.15
    text: "Engineered repair details, designs, or specialty materials required."
  excl_architectural:
    loc: p.16
    text: "Architectural design, façade redesign, or color/finish selection services."
  excl_concealed:
    loc: p.16
    text: "Concealed deterioration, structural deficiencies, reinforcement loss, or substrate failures discovered during demolition, powerwashing, excavation, or preparation."
  excl_full_depth:
    loc: p.16
    text: "Full-depth structural concrete repairs unless specifically listed."
  excl_balcony_slab:
    loc: p.16
    text: "Balcony slab replacements, structural beam repairs, or deck waterproofing systems."
  excl_railing_coatings:
    loc: p.16
    text: "Specialty railing coatings, powder coating, or anodizing unless specified."
  excl_waterproofing:
    loc: p.16
    text: "Balcony waterproofing membranes, coatings, or traffic-bearing systems."
  excl_expansion:
    loc: p.16
    text: "Expansion joint replacements not listed."
  excl_electrical:
    loc: p.16
    text: "Electrical conduit relocation, wiring modifications, or power supply adjustments."
  excl_mep:
    loc: p.16
    text: "HVAC, plumbing, or mechanical system modifications."
  excl_interior:
    loc: p.16
    text: "Interior painting or coatings not listed in Division 09."
  excl_specialty_coatings:
    loc: p.16
    text: "Specialty coatings, elastomeric systems, or anti-graffiti coatings unless specified."
  excl_soffit_coatings:
    loc: p.16
    text: "Ceiling soffit coatings."
  excl_permits:
    loc: p.16
    text: "Permits, fees, inspections, or third-party testing."
  excl_mold:
    loc: p.16
    text: "Mold remediation, hazardous material abatement, or environmental testing."
  excl_tenants:
    loc: p.16
    text: "Temporary relocation of tenants or furnishings."
  excl_engineering:
    loc: p.16
    text: "Engineering Support"

  # Terms, p.16-17
  alternates_intro:
    loc: p.17
    text: "Alternate pricing provides costs for optional work or materials not included in the base scope of the project. Each alternate is priced separately and is not in the base contract total unless approved in writing."
  change_orders:
    loc: p.16
    text: "Change orders: Adjustments can be made to the initial contract and scope of the project to account for changing needs that are mutually agreed upon by Contractor Co. Restoration & Renovations and you, the customer. These adjustments are called change orders and must be written as a document and added to the contract."
  costs:
    loc: p.16
    text: "Costs: The customer is responsible for accessibility to areas of the building and utilities. Prompt payment at key milestones. Contractor Co. Restoration & Renovations is responsible for management of materials, labor, schedule, job site quality and scope of work."
  warranty:
    loc: p.16
    text: "Warranty: A 1-year workmanship warranty period will begin at completion of the job."
  allowance_definition:
    loc: p.16
    text: "Allowance is the quantity of unit pricing included in the base bid."
