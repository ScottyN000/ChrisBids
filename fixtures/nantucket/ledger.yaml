     statement: 'S-1 specifies Hilti HIT HY 70, which Hilti set to phase-out and names HIT-HY 270 as its direct replacement in masonry (NAN-C-014; ESR-4143 per NAN-C-015). Ask the engineer to approve a substitute in writing. Do not order HY 70, and do not order HY 270 before approval'}
  - {id: NAN-OQ-02, role: question, method: FIELD, confidence: missing, source: S-1, locator: Det 1, tag: S-1 Det 1,
     statement: 'Repair depth and extent on the plank underside (NAN-F-004, NAN-F-005): S-1 gives "down to sound material" with no dimension'}
  - {id: NAN-OQ-03, role: question, method: counted, confidence: exact, source: S-1, locator: Det 1, tag: S-1 Det 1,
     statement: 'Confirm with the engineer: 3 anchors and 3 bolts per bracket are counted from the drawing; the callouts say (TYP.) without a number'}
  - {id: NAN-OQ-04, role: question, method: scaled, confidence: scaled, source: S-1, locator: Det 1, tag: S-1 Det 1,
     statement: 'Angle leg lengths exist only as scale on an undimensioned detail, and two scalings disagree (NAN-S-001 to NAN-S-003). Ask the engineer for dimensions or rely on the fabricator survey'}
  - {id: NAN-OQ-05, role: question, method: clause, confidence: exact, source: S-1 + PFE, locator: GN; PFE p.16, tag: S-1 GN + PFE p.16,
     supersedes: 'NAN-TB p.7 listed permits, fees and inspections as an exclusion',
     reason: 'S-1 GN assigns these costs to the contractor, so excluding them conflicts with the drawing. Both readings shown; the estimator decides',
     statement: 'Permits, testing and inspections: S-1 GN assigns their cost to the contractor; Contractor Co.''s standard proposal excludes them. Carry an allowance, or exclude with the owner''s written acceptance?'}
  - {id: NAN-OQ-06, role: question, method: clause, confidence: exact, source: WEB, locator: Bus. Reg. 8-101; Ocean City forms, tag: NAN-C-004 + NAN-C-005,
     statement: 'Licensing: Ocean City requires MHIC and an Ocean City Business License for condominium repair (NAN-C-004), while the state MHIC definition excludes condominium common areas (NAN-C-005) and Maryland issues construction licenses for commercial work through the Circuit Court clerks (NAN-C-006). Ask the Ocean City permit desk and the Worcester County Clerk which licenses apply'}
  - {id: NAN-OQ-07, role: question, method: clause, confidence: exact, source: WEB, locator: ICC; MAA matrix, tag: NAN-C-012 + NAN-C-013,
     statement: 'Special inspection of the adhesive anchors: the IBC 2021 Chapter 17 text could not be opened (NAN-C-012). Ask the Ocean City building official whether it is required and who performs it'}
  - {id: NAN-OQ-08, role: question, method: clause, confidence: exact, source: WEB, locator: MD BCA news, tag: NAN-C-010,
     statement: 'Maryland has proposed adopting the 2024 IBC (NAN-C-010). Confirm the code edition in force when the permit is filed'}

