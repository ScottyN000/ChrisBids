name: ci

on:
  push:
    branches: [main]
  pull_request:

# Actions minutes are billed while the repo is private: a branch push with a PR open used to run
# this twice (push and pull_request), so branches run it through their PR only,
# and a newer push cancels the older run (never on main, so each merge commit
# keeps its own run).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install poppler and the Python requirements
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python -m pip install --quiet -r requirements.txt
      - name: Golden fixtures are not stale
        run: |
          python tools/build_fixture.py fixtures/nantucket --check
          python tools/build_fixture.py fixtures/ocean-beach --check
      - name: Fixtures load through the broker and export byte-identically
        run: python -m pipeline verify-fixtures --out "$RUNNER_TEMP/verify"
      - name: Readers replay the golden jobs and reproduce their figures
        run: |
          python -m pipeline replay fixtures/nantucket --out "$RUNNER_TEMP/replay-nan"
          python -m pipeline replay fixtures/ocean-beach --out "$RUNNER_TEMP/replay-obv"
      - name: The pipeline DAG matches the code
        run: python tools/render_dag.py --check
      - name: Tests
        run: python -m unittest discover -s tests -t . -v
