name: mutation

# Mutation testing: mutmut makes small edits to pipeline/ (a < becomes <=, a
# string changes, a condition flips) and runs the tests against each one. A
# mutant the tests do not catch marks code nothing really checks. This job
# fails when the score drops below the floor in tools/mutation_gate.py.

on:
  pull_request:
    paths:
      - "pipeline/**"
      - "tests/**"
      - "pyproject.toml"
      - "tools/mutation_gate.py"
      - ".github/workflows/mutation.yml"
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "tests/**"
  workflow_dispatch:

# A full run takes about 20 minutes; a newer push to the same branch makes the
# older run moot, so it is cancelled rather than left holding a runner.
concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutmut:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install poppler, the Python requirements, pytest and mutmut
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python -m pip install --quiet -r requirements.txt pytest==9.1.1 mutmut==3.8.0
      - name: Run mutmut on pipeline/
        run: python -m mutmut run --max-children "$(nproc)"
      - name: Surviving mutants
        if: always()
        run: python -m mutmut results | grep -E "survived|no tests" || true
      - name: Mutation score is at or above the floor
        run: |
          python -m mutmut export-cicd-stats
          python tools/mutation_gate.py
