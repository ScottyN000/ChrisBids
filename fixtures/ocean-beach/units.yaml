# What a live run shows each reader: one spec page or one photo per call.
# Files come from register.csv; paths there are relative to the packet root.
# Spec pages are sent as their text layer (the register notes SW has a good one),
# which is also what the Auditor searches when it checks a quote.
spec:
  - unit_id: SW#p17
    source_id: SW
    locator: p.17
    tag: SW p.17
    page: 17
