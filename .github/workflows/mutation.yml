name: mutation

# Mutation testing: mutmut makes small edits to pipeline/ (a < becomes <=, a
# string changes, a condition flips) and runs the tests against each one. A
# mutant the tests do not catch marks code nothing really checks. This job
# fails when the score drops below the floor in tools/mutation_gate.py.

# Per-PR mutation testing runs locally, in the session that builds the PR, on
# the functions the PR changes (tools/changed_mutants.py), and the PR
# description names that run by its head sha (Scott, 2026-10-10: the per-PR
# CI runs took too long and cost Actions minutes; this job was most of them).
# Here the job runs every mutant: weekly on main, catching a module no PR
# touched that has fallen below the floor, and by hand.
on:
  schedule:
    - cron: "41 7 * * 1"   # weekly, on main
  workflow_dispatch:

# The job only reads the checkout: the token gets no more than that.
permissions:
  contents: read

# A full run took about 45 minutes before Phase 3 and grows with the code; the
# first Phase 3 run hit the old 90-minute limit. A run started by hand cancels a
# scheduled one still going, rather than leaving two holding runners.
concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutmut:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install poppler, the Python requirements, pytest and mutmut
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python -m pip install --quiet -r requirements.txt pytest==9.1.1 mutmut==3.8.0
      - name: Run mutmut
        run: python -m mutmut run --max-children "$(nproc)"
      - name: Surviving mutants
        if: always()
        run: python -m mutmut results | grep -E "survived|no tests" || true
      - name: Mutation score is at or above the floor
        run: |
          python -m mutmut export-cicd-stats
          python tools/mutation_gate.py
